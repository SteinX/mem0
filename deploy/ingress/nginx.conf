user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_request_id $mem0_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$mem0_request_id';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream mem0_core {
        zone mem0_core 64k;
        server mem0:8000 resolve;
    }

    upstream mem0_sidecar {
        zone mem0_sidecar 64k;
        server mem0-platform-sidecar:8765 resolve;
    }

    upstream mem0_mcp {
        zone mem0_mcp 64k;
        server mem0-oss-mcp:8080 resolve;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $mem0_request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-Mem0-Caller-Context "";
    proxy_set_header Connection "";

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"mem0-ingress"}';
        }

        location = /mcp {
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://mem0_mcp;
        }

        location ~ ^/(?:memories(?:/.*)?|search|v1/memories(?:/.*)?|v3/memories(?:/.*)?)$ {
            proxy_pass http://mem0_sidecar;
        }

        location ~ ^/(?:auth(?:/.*)?|api-keys(?:/.*)?|configure(?:/.*)?|generate-instructions|health|docs(?:/.*)?|redoc|openapi\.json)$ {
            proxy_pass http://mem0_core;
        }

        location / { return 404; }
    }

    server {
        listen 8081;
        server_name _;

        location = /mcp {
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://mem0_mcp;
        }

        location = /health {
            proxy_pass http://mem0_mcp;
        }

        location / { return 404; }
    }
}
