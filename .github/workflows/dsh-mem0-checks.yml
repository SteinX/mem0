name: dsh-mem0 checks

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/dsh-mem0/**'
      - '.github/workflows/dsh-mem0-checks.yml'
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: integrations/dsh-mem0/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/dsh-mem0 && pnpm install --frozen-lockfile

      - name: Type check
        run: cd integrations/dsh-mem0 && pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: integrations/dsh-mem0/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/dsh-mem0 && pnpm install --frozen-lockfile

      - name: Run tests
        run: cd integrations/dsh-mem0 && pnpm exec vitest run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: integrations/dsh-mem0/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/dsh-mem0 && pnpm install --frozen-lockfile

      - name: Build
        run: cd integrations/dsh-mem0 && pnpm build

      - name: Verify dist output exists
        run: |
          test -f integrations/dsh-mem0/dist/index.js || (echo "Build output missing: dist/index.js" && exit 1)
          test -f integrations/dsh-mem0/dist/index.d.ts || (echo "Build output missing: dist/index.d.ts" && exit 1)
