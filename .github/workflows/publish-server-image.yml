name: Publish Mem0 Server Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to publish from an existing Git tag.
        required: true
        type: string
      push_latest:
        description: Also update the latest tag.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish from an existing Git tag.
        required: true
        default: v2.2.1-steinx.1
        type: string
      push_latest:
        description: Also update the latest tag.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/steinx/mem0
  IMAGE_TAG: ${{ github.event.release.tag_name || inputs.image_tag }}
  PUSH_LATEST: ${{ inputs.push_latest }}

jobs:
  publish:
    if: github.repository == 'SteinX/mem0'
    name: Build and publish server image
    runs-on: ubuntu-latest
    concurrency:
      group: server-image-${{ github.repository }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Validate requested tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$(git rev-parse --verify "refs/tags/$IMAGE_TAG^{commit}")" = "$source_sha"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "$source_sha" = "$GITHUB_SHA"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decide latest promotion
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          push_latest="$PUSH_LATEST"
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$push_latest" = "true" ]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$latest_tag" != "$IMAGE_TAG" ]; then
              push_latest=false
              echo "::notice::Skipping latest for outdated release tag: $IMAGE_TAG (current: $latest_tag)"
            fi
          fi
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.push_latest }}
            type=raw,value=sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          annotations: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/release.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Publish summary
        env:
          PUSH_LATEST: ${{ steps.latest.outputs.push_latest }}
        run: |
          {
            echo "### Mem0 server image"
            echo
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Commit: \`${{ steps.release.outputs.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Latest: \`$PUSH_LATEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
