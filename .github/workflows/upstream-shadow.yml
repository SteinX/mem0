name: Upstream shadow monitor

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-shadow
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'SteinX/mem0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Collect immutable upstream snapshot without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/upstream-shadow.js collect .github/upstream-shadow.json upstream-shadow.json
      - name: Summary
        run: |
          node -e 'const s=require("./upstream-shadow.json"); console.log("## Upstream shadow\n\n```json\n"+JSON.stringify(s,null,2)+"\n```\n\nNo merge or publication is authorized.")' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-shadow-${{ github.run_id }}
          path: upstream-shadow.json
          if-no-files-found: error
          retention-days: 30
