name: Publish @mem0/dsh-mem0 📦 to npm

# Dispatched by release.yml (Release Router) when a release tagged
# dsh-mem0-v* is published. Can also be dispatched manually to re-publish
# a tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. dsh-mem0-v0.1.1)'
        required: true
        type: string
      prerelease:
        description: 'Publish under the version preid dist-tag instead of latest'
        required: false
        type: boolean
        default: false

jobs:
  build-n-publish:
    name: Build and publish @mem0/dsh-mem0 📦 to npm
    if: startsWith(inputs.tag, 'dsh-mem0-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: integrations/dsh-mem0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: integrations/dsh-mem0/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: |
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PREID=$(node -p "require('./package.json').version.split('-')[1].split('.')[0]")
            npx npm@12.0.2 publish --provenance --access public --tag "$PREID"
          else
            npx npm@12.0.2 publish --provenance --access public
          fi
